[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "modal-plugin"
version = "0.3.0"
description = "OAuth-protected MCP control plane for Modal pipelines, linked accounts, model artifacts, and GPU runs from ChatGPT and Codex."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "modal-plugin contributors" }]
dependencies = [
  "cryptography>=45,<47",
  "mcp>=2,<3",
  "modal>=1.5,<2",
  "PyJWT[crypto]>=2.10,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "starlette>=0.47,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
modal-plugin = "modal_plugin.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/modal_plugin"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
